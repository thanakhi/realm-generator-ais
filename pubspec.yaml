name: realm_generator
description: >-
  Generates RealmObject classes from Realm data model classes.
  This package is part of the official Realm Flutter and Realm Dart SDKs.

version: 20.2.0

# Fork of the discontinued upstream generator — never publish to pub.dev.
publish_to: none

homepage: https://www.realm.io
repository: https://github.com/thanakhi/realm-generator-ais

environment:
  sdk: ^3.11.0

dependencies:
  # Widened from ^12.1.0: the <13 cap guarded the workspace-wide resolution for
  # ejson_lint's analysis_server_plugin (dart-lang/sdk#63538 — an IDE plugin-host
  # hang); the codegen path is unaffected. Consumers on analyzer 13/14 need this.
  analyzer: ">=12.1.0 <15.0.0"
  build: ^4.0.0
  dart_style: ^3.0.1
  realm_common: ^20.2.0
  source_gen: ^4.0.1
  source_span: ^1.8.1
  collection: ^1.19.1

dev_dependencies:
  build_runner: ^2.5.3
  build_test: ^3.2.1
  lints: ^6.0.0
  logging: ^1.2.0
  meta: ^1.16.0
  path: ^1.9.0
  term_glyph: ^1.2.0
  test: ^1.25.9
  pub_semver: ^2.2.0
